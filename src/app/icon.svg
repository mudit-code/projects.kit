<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1930 1930">
  <defs>
    <style>
      :root {
        --brand-fav: #1C3A7F;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --brand-fav: #4F86F7;
        }
      }
      .fav-diamond {
        fill: var(--brand-fav);
        stroke: var(--brand-fav);
      }
    </style>
    <mask id="cut-app-icon" maskUnits="userSpaceOnUse" x="0" y="0" width="1930" height="1930">
      <rect width="1930" height="1930" fill="#fff" />
      <g fill="none" stroke="#000" stroke-width="105">
        <line x1="928" y1="585" x2="770" y2="1135" />
        <line x1="928" y1="585" x2="1345" y2="1005" />
        <line x1="770" y1="1135" x2="1345" y2="1005" />
        <line x1="770" y1="1135" x2="587" y2="1732" />
      </g>
      <g fill="#000">
        <circle cx="928" cy="585" r="165" />
        <circle cx="1345" cy="1005" r="165" />
        <circle cx="770" cy="1135" r="165" />
      </g>
    </mask>
  </defs>
  <polygon
    class="fav-diamond"
    points="965,413.5 1516.5,965 965,1516.5 413.5,965"
    stroke-width="600"
    stroke-linejoin="round"
    mask="url(#cut-app-icon)"
  />
</svg>
